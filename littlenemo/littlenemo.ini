; littlenemo.ini - Little Nemo chat configuration.
; Put this file beside the engine (or beside gui/nemo_chat.py) and
; the GUI opens with no command-line arguments: it reads the paths
; below, starts the engine, and connects. Relative paths resolve
; against this file's own directory. Command-line arguments
; (--engine, --host, --port, --config) override this file.

[paths]
; The engine binary (build it with build.bat or build.sh first),
; the checkpoint directory, and its tokenizer file.
engine     = ./bin/nemo-engine
checkpoint = ./Nemotron-Nano-9B-v2
tokenizer  = ./Nemotron-Nano-9B-v2/tokenizer.json

[engine]
; How much of the machine the engine may use. The engine queries
; the core count itself and splits the work proportionally:
;   minimum = 1 core, medium = half, max = all but one,
;   ultra   = every core.
mode    = max
; An exact lane count, if you want one. 0 lets the mode decide.
threads = 0
; SIMD (AVX2) projections: true or false. Faster on machines that
; have AVX2; the engine checks the CPU itself and stays scalar on
; older hardware either way. The scalar path is the golden
; reference; SIMD is deterministic but may differ in the last
; bits. The READY line reports which is active.
simd    = false
max_new = 256
max_pos = 4096

[remote]
; To talk to an engine running on another machine instead of a
; local one, set host and port here and leave [paths] empty.
host =
port =

[supernemo]
; SuperNemo (Nemotron 3.5 Super VL 120B-A12B). NTSE has no engine
; path for its 512-expert MoE and RADIO vision tower yet, so leave
; this empty: the GUI shows "SuperNemo engine not available yet" and
; sends nothing. When the engine exists, set its full command line
; here (engine = ...), or host and port for a remote one.
engine =
host =
port =
[appearance]
theme = pixel
[model.supernemo]
icon = 
shape = blob
fill = #A970FF
outline = #FF9B42
face = true
size = 32
motion = bob
speed = 1
[model.littlenemo]
icon = 
shape = droplet
fill = #FF9B42
outline = #A970FF
face = true
size = 32
motion = flip
speed = 1
