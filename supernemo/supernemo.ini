; SuperNemo engine wiring for the NTSE chat GUI. Use it with the GUI's --config
; option (or paste the engine line into [supernemo] of your own ini). The release
; littlenemo.ini is left alone on purpose.
;
; sn-engine speaks protocol v3. Text chat works as soon as the pack is published;
; image and video are refused with a plain reason until the RADIO tower lands.
; --below-normal keeps it polite while other jobs run; drop it for full speed.
; Add --gpu-mb 3000 to keep the dense tensors and lm_head in VRAM on a 4 GB card (needs the CUDA toolkit on CUDA_PATH).
; With it the routed experts also stream through the card (see GPU-EXPERT-STREAM.md); --no-gpu-experts turns that off.
[supernemo]
engine = <repo>\supernemo\sn-engine.exe --pack <pack-dir>\nemotron-3.5-super-vl --config <checkpoint-dir>\config.json --tokenizer <checkpoint-dir>\tokenizer.json --max-pos 4096 --max-new 256 --below-normal
host =
port =

; Optional tuning, pass with --ini on the engine line (command-line flags win). Safe to leave out.
[supernemo-tuning]
; dtc: off | auto | force  (compute straight on the packed blocks; auto = where it pays)
dtc = auto
; hot-expert cache budgets in MB (RAM tier, VRAM tier; the VRAM tier needs --gpu-mb and DTC)
cache_mb = 4096
gpu_cache_mb = 0
; speculative decoding with the MTP head (greedy, token-identical): on by default (JD, 2026-11-27); about 80% of the
; drafted tokens were accepted on the real pack. spec = 0 (or --no-spec) turns it off.
spec = 1
draft_len = 3
; gpu_experts: send routed experts to the card in compressed form, expand and compute them there, reuse the slots
; for the next token (on by default whenever --gpu-mb is above 0; slots sized from the hardware calibration)
gpu_experts = 1
; GPU expert stream speed-ups, each on by default and results-identical (0 or the engine flag turns one off):
; expert_prefetch: run the next MoE layer's router one layer early and send its experts ahead (--no-prefetch)
expert_prefetch = 1
; pinned_cache: keep the RAM expert cache in pinned memory so the card copies straight from it (--no-pinned-cache)
pinned_cache = 1
; stream_slot_cap: with --gpu-mb 0 (only the stream on the card), cap the slots at 300 so the card is not paged (--no-slot-cap)
stream_slot_cap = 1
