; littlenemo.ini - Little Nemo chat configuration.
; Put this file beside the engine (or beside gui/nemo_chat.py) and
; the GUI opens with no command-line arguments: it reads the paths
; below, starts the engine, and connects. Relative paths resolve
; against this file's own directory. Command-line arguments
; (--engine, --host, --port, --config) override this file.

[paths]
; The engine binary (build it with build.bat or build.sh first),
; the checkpoint directory, and its tokenizer file.
engine     = ./bin/nemo-engine
checkpoint = ./Nemotron-Nano-9B-v2
tokenizer  = ./Nemotron-Nano-9B-v2/tokenizer.json

[engine]
; How much of the machine the engine may use. The engine queries
; the core count itself and splits the work proportionally:
;   minimum = 1 core, medium = half, max = all but one,
;   ultra   = every core.
mode    = max
; An exact lane count, if you want one. 0 lets the mode decide.
threads = 0
max_new = 256
max_pos = 4096

[remote]
; To talk to an engine running on another machine instead of a
; local one, set host and port here and leave [paths] empty.
host =
port =
